services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quanmoi_app
    restart: unless-stopped
    entrypoint: ["apache2-foreground"]
    ports:
      - "${APP_PORT:-8002}:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8002}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: quanmoi
      DB_USERNAME: quanmoi
      DB_PASSWORD: quanmoi_password
      ELASTIC_HOST: http://elasticsearch:9200
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quanmoi_network

  db:
    image: mysql:8.0
    container_name: quanmoi_db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISHED_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: quanmoi
      MYSQL_USER: quanmoi
      MYSQL_PASSWORD: quanmoi_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - quanmoi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uquanmoi", "-pquanmoi_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - quanmoi_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: quanmoi_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quanmoi_network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: quanmoi_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - quanmoi_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - quanmoi_network

volumes:
  quanmoi_db_data:
  quanmoi_elasticsearch_data:

networks:
  quanmoi_network:
    driver: bridge
