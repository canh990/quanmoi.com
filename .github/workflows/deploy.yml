name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - cicd
  pull_request:
    branches:
      - master
      - main
      - cicd

jobs:
  laravel-tests-and-build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, sqlite3, pdo_sqlite, bcmath, curl, zip, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install & Build NPM Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Environment File & Run Migrations
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --env=testing --force

      - name: Execute Tests
        run: php artisan test --env=testing
        continue-on-error: true

  deploy-to-server:
    name: Deploy to Production Server
    needs: laravel-tests-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cicd'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Command (Production)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH || '/var/www/quanmoi.com' }}
            git pull origin ${GITHUB_REF_NAME:-cicd}
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
